<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KricIQ — IPL Teams</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080b11;--s1:#0f131c;--s2:#161c28;--s3:#1e2535;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --acc:#00f5aa;--acc2:#ff5f40;--acc3:#5b9fff;--acc4:#f7c948;
  --text:#eef0f4;--muted:#5a6275;--muted2:#8892a4;
  --font-d:'Bebas Neue',sans-serif;--font-b:'Outfit',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;overflow-x:hidden;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;background:rgba(8,11,17,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;backdrop-filter:blur(16px);}
.nav-links{display:flex;gap:2px;}
.nl{padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted2);cursor:pointer;transition:.15s;border:none;background:none;font-family:var(--font-b);text-decoration:none;}
.nl:hover{color:var(--text);background:var(--s2);}
.nl.on{color:var(--acc);background:rgba(0,245,170,.08);}
.nav-r{display:flex;align-items:center;gap:10px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:5px 12px;position:relative;}
.search-box input{background:none;border:none;color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;width:180px;}
.search-box input::placeholder{color:var(--muted);}
.page-header{background:var(--s1);border-bottom:1px solid var(--border);padding:32px 28px 28px;}
.page-header-inner{max-width:1160px;margin:0 auto;}
.page-title{font-family:var(--font-d);font-size:48px;letter-spacing:1px;margin-bottom:6px;}
.page-title span{color:var(--acc);}
.page-sub{font-size:13px;color:var(--muted2);}
.wrap{max-width:1160px;margin:0 auto;padding:28px;}
.teams-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:32px;}
.team-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:.2s;text-align:center;position:relative;overflow:hidden;}
.team-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--tc,var(--acc));transform:scaleX(0);transition:.3s;transform-origin:left;}
.team-card:hover,.team-card.active{border-color:var(--border2);background:var(--s2);transform:translateY(-2px);}
.team-card:hover::before,.team-card.active::before{transform:scaleX(1);}
.team-card.active{transform:none;}
.team-badge{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:17px;font-weight:700;margin:0 auto 10px;}
.team-name{font-size:11px;font-weight:500;color:var(--text);line-height:1.4;}
.team-detail{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:none;}
.team-detail.show{display:block;}
.td-header{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;}
.td-badge{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:22px;font-weight:700;flex-shrink:0;}
.td-name{font-family:var(--font-d);font-size:32px;letter-spacing:1px;}
.td-sub{font-size:12px;color:var(--muted2);margin-top:4px;}
.td-stats{display:flex;border-bottom:1px solid var(--border);}
.td-stat{flex:1;padding:14px 18px;text-align:center;border-right:1px solid var(--border);}
.td-stat:last-child{border-right:none;}
.td-sv{font-family:var(--font-d);font-size:24px;color:var(--acc);line-height:1;}
.td-sk{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:3px;}
.players-section{padding:20px 28px 28px;}
.ps-title{font-family:var(--font-d);font-size:18px;letter-spacing:.5px;margin-bottom:14px;}
.ps-title em{color:var(--acc);font-style:normal;}
.player-table{width:100%;border-collapse:collapse;}
.player-table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);}
.player-table th:not(:first-child){text-align:right;}
.player-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.player-table td:not(:first-child){text-align:right;}
.player-table tr:last-child td{border-bottom:none;}
.player-table tbody tr:hover td{background:var(--s2);}
.player-link{color:var(--text);text-decoration:none;font-weight:500;display:flex;align-items:center;gap:8px;}
.player-link:hover{color:var(--acc);}
.p-init{width:28px;height:28px;border-radius:6px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:11px;color:var(--acc);flex-shrink:0;}
.sv{font-family:var(--font-d);font-size:15px;}
.loading-msg{text-align:center;padding:40px;color:var(--muted2);}
.spinner{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(8,11,17,.97);border-top:1px solid rgba(255,255,255,0.1);padding:8px 0 12px;backdrop-filter:blur(20px);}
.mobile-nav-inner{display:flex;justify-content:space-around;align-items:center;}
.mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 16px;}
.mnav-item svg{width:20px;height:20px;stroke:var(--muted2);}
.mnav-item span{font-size:10px;color:var(--muted2);}
.mnav-item.active svg{stroke:var(--acc);}
.mnav-item.active span{color:var(--acc);}
@media(max-width:768px){
  .teams-grid{grid-template-columns:repeat(2,1fr);}
  .mobile-nav{display:block;}
  body{padding-bottom:70px;}
  .nav-links{display:none;}
  .td-stats{flex-wrap:wrap;}
  .td-stat{min-width:50%;}
  .wrap{padding:16px;}
}
</style>

<script>
var _kapi = 'https://kriciq-api.onrender.com/api';

// ── TEAM DEFINITIONS — merged duplicates, current 10 teams ──
var TEAMS = [
  {id:'mi',   name:'Mumbai Indians',          abbr:'MI',   color:'#4d9fff', bg:'rgba(77,159,255,.15)',  aliases:['Mumbai Indians']},
  {id:'csk',  name:'Chennai Super Kings',     abbr:'CSK',  color:'#f7c948', bg:'rgba(247,201,72,.15)',  aliases:['Chennai Super Kings']},
  {id:'rcb',  name:'Royal Challengers',       abbr:'RCB',  color:'#ff5f40', bg:'rgba(255,95,64,.15)',   aliases:['Royal Challengers Bangalore','Royal Challengers Bengaluru']},
  {id:'kkr',  name:'Kolkata Knight Riders',   abbr:'KKR',  color:'#c084fc', bg:'rgba(192,132,252,.15)', aliases:['Kolkata Knight Riders']},
  {id:'srh',  name:'Sunrisers Hyderabad',     abbr:'SRH',  color:'#ff8c40', bg:'rgba(255,140,64,.15)',  aliases:['Sunrisers Hyderabad']},
  {id:'dc',   name:'Delhi Capitals',          abbr:'DC',   color:'#3b82f6', bg:'rgba(59,130,246,.15)',  aliases:['Delhi Capitals','Delhi Daredevils']},
  {id:'pbks', name:'Punjab Kings',            abbr:'PBKS', color:'#ff5f40', bg:'rgba(255,95,64,.12)',   aliases:['Punjab Kings','Kings XI Punjab']},
  {id:'rr',   name:'Rajasthan Royals',        abbr:'RR',   color:'#e879f9', bg:'rgba(232,121,249,.15)', aliases:['Rajasthan Royals']},
  {id:'lsg',  name:'Lucknow Super Giants',    abbr:'LSG',  color:'#00f5aa', bg:'rgba(0,245,170,.12)',   aliases:['Lucknow Super Giants']},
  {id:'gt',   name:'Gujarat Titans',          abbr:'GT',   color:'#5b9fff', bg:'rgba(91,159,255,.15)',  aliases:['Gujarat Titans']},
];

// Cache for team stats from API
var _teamStats = {};
var _activeTeam = null;

function _initials(name){
  return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
}

// ── RENDER TEAM CARDS ──
function renderTeamCards(){
  var grid = document.getElementById('teams-grid');
  grid.innerHTML = TEAMS.map(function(t){
    return '<div class="team-card" id="card-'+t.id+'" style="--tc:'+t.color+'" onclick="selectTeam(\''+t.id+'\')">'
      +'<div class="team-badge" style="background:'+t.bg+';color:'+t.color+'">'+t.abbr+'</div>'
      +'<div class="team-name">'+t.name+'</div>'
      +'</div>';
  }).join('');
}

// ── LOAD TEAM STATS from /api/team-stats ──
function loadTeamStats(){
  fetch(_kapi+'/team-stats')
    .then(function(r){return r.json();})
    .then(function(data){
      // Map API results to our team definitions by matching aliases
      data.forEach(function(row){
        TEAMS.forEach(function(t){
          if(t.aliases.some(function(a){return a===row.team;})){
            if(!_teamStats[t.id]){
              _teamStats[t.id]={matches:0,total_runs:0,avg_score_per_match:0,count:0};
            }
            _teamStats[t.id].matches += row.matches;
            _teamStats[t.id].total_runs += row.total_runs;
            _teamStats[t.id].avg_score_per_match += row.avg_score_per_match||0;
            _teamStats[t.id].count += 1;
          }
        });
      });
      // Always compute avg from total_runs / matches for accuracy
      Object.keys(_teamStats).forEach(function(id){
        var ts = _teamStats[id];
        ts.avg_score_per_match = ts.matches > 0 ? Math.round(ts.total_runs / ts.matches) : 0;
      });
    }).catch(function(){});
}

// ── SELECT TEAM ──
function selectTeam(teamId){
  // Update active card
  document.querySelectorAll('.team-card').forEach(function(c){c.classList.remove('active');});
  document.getElementById('card-'+teamId).classList.add('active');
  _activeTeam = teamId;

  var team = TEAMS.find(function(t){return t.id===teamId;});
  var detail = document.getElementById('team-detail');
  detail.classList.add('show');

  // Scroll to detail
  setTimeout(function(){detail.scrollIntoView({behavior:'smooth',block:'nearest'});},100);

  // Update header
  document.getElementById('td-badge').textContent = team.abbr;
  document.getElementById('td-badge').style.background = team.bg;
  document.getElementById('td-badge').style.color = team.color;
  document.getElementById('td-name').textContent = team.name;
  document.getElementById('td-sub').textContent = 'IPL franchise · '+team.aliases[0];

  // Update stats from cache
  var ts = _teamStats[teamId];
  if(ts){
    document.getElementById('td-matches').textContent = ts.matches;
    document.getElementById('td-runs').textContent = ts.total_runs.toLocaleString();
    document.getElementById('td-avgscore').textContent = ts.avg_score_per_match || Math.round(ts.total_runs / ts.matches);
  }
  document.getElementById('td-hundreds').textContent = '—';
  document.getElementById('td-fifties').textContent  = '—';

  // Load players
  loadTeamPlayers(team);
}

// ── LOAD TEAM PLAYERS ──
function loadTeamPlayers(team){
  document.getElementById('players-container').innerHTML =
    '<div class="loading-msg"><div class="spinner"></div>Loading squad...</div>';

  // Use /api/squad/ which queries balls table directly — accurate per-team stats
  // For teams with multiple aliases (RCB, DC, PBKS), fetch all and merge
  var fetches = team.aliases.map(function(alias){
    return fetch(_kapi+'/squad/'+encodeURIComponent(alias.replace(/ /g,'-')))
      .then(function(r){return r.json();})
      .catch(function(){return [];});
  });
  Promise.all(fetches).then(function(results){
    var players = [];
    results.forEach(function(batch){
      batch.forEach(function(p){
        var existing = players.find(function(x){return x.player===p.player;});
        if(existing){
          // Merge runs/matches across aliases — but MAX hundreds/fifties (same player, don't double count)
          existing.runs    += p.runs;
          existing.matches += p.matches;
          existing.sixes   += p.sixes||0;
          existing.fours   += p.fours||0;
          existing.hundreds     = Math.max(existing.hundreds||0,     p.hundreds||0);
          existing.fifties      = Math.max(existing.fifties||0,      p.fifties||0);
          existing.average      = Math.max(existing.average||0,      p.average||0);
          existing.highest_score= Math.max(existing.highest_score||0,p.highest_score||0);
        } else {
          players.push(p);
        }
      });
    });
    players.sort(function(a,b){return b.runs-a.runs;});
    document.getElementById('td-players').textContent = players.length;
    var totalH = players.reduce(function(s,p){return s+(p.hundreds||0);},0);
    var totalF = players.reduce(function(s,p){return s+(p.fifties||0);},0);
    var hasRealH = players.some(function(p){return (p.hundreds||0)>0;});
    var hasRealF = players.some(function(p){return (p.fifties||0)>0;});
    document.getElementById('td-hundreds').textContent = hasRealH ? totalH : '—';
    document.getElementById('td-fifties').textContent  = hasRealF ? totalF : '—';
    renderPlayers(players, team);
  }).catch(function(){
    document.getElementById('players-container').innerHTML =
      '<div class="loading-msg">Could not load players.</div>';
  });
}

// ── RENDER PLAYERS TABLE ──
function renderPlayers(players, team){
  if(!players.length){
    document.getElementById('players-container').innerHTML =
      '<div class="loading-msg">No players found for this team.</div>';
    return;
  }
  var html = '<table class="player-table">'
    +'<thead><tr>'
    +'<th>Player</th><th>Matches</th><th>Runs</th><th>Average</th><th>Strike Rate</th><th>100s</th><th>50s</th>'
    +'</tr></thead><tbody>';

  players.forEach(function(p, i){
    var id = p.player.replace(/ /g,'-');
    var initials = _initials(p.player);
    html += '<tr>'
      +'<td><a href="player.html?id='+id+'" class="player-link">'
      +'<div class="p-init" style="color:'+team.color+'">'+initials+'</div>'
      +p.player+'</a></td>'
      +'<td><span class="sv">'+Math.round(p.matches)+'</span></td>'
      +'<td><span class="sv" style="color:var(--acc)">'+Math.round(p.runs).toLocaleString()+'</span></td>'
      +'<td><span class="sv" style="color:var(--acc3)">'+(p.average?parseFloat(p.average).toFixed(1):'—')+'</span></td>'
      +'<td><span class="sv" style="color:var(--acc4)">'+(p.strike_rate?parseFloat(p.strike_rate).toFixed(1):'—')+'</span></td>'
      +'<td><span class="sv" style="color:var(--acc2)">'+(p.hundreds>0?p.hundreds:(p.runs>300?'—':0))+'</span></td>'
      +'<td><span class="sv" style="color:var(--acc3)">'+(p.fifties>0?p.fifties:(p.runs>150?'—':0))+'</span></td>'
      +'</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('players-container').innerHTML = html;
}

// ── NAV SEARCH ──
function initSearch(){
  var inp = document.getElementById('nav-search');
  if(!inp) return;
  var drop = document.createElement('div');
  drop.style.cssText='display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:280px;background:#0f131c;border:1px solid rgba(255,255,255,0.1);border-radius:8px;z-index:999;max-height:280px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);';
  inp.parentNode.appendChild(drop);
  var t;
  inp.addEventListener('input',function(){
    clearTimeout(t);
    var q=this.value.trim();
    if(q.length<2){drop.style.display='none';return;}
    t=setTimeout(function(){
      fetch(_kapi+'/search/'+encodeURIComponent(q))
        .then(function(r){return r.json();})
        .then(function(players){
          drop.innerHTML=players.length
            ?players.map(function(p){var id=p.player.replace(/ /g,'-');return '<a href="player.html?id='+id+'" style="display:flex;justify-content:space-between;padding:9px 14px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.05);color:#eef0f4;font-size:13px;">'+p.player+'<span style="color:#5a6275;font-size:11px;">'+Math.round(p.runs)+' runs</span></a>';}).join('')
            :'<div style="padding:10px 14px;color:#5a6275;font-size:13px;">No players found</div>';
          drop.style.display='block';
        }).catch(function(){drop.style.display='none';});
    },300);
  });
  document.addEventListener('click',function(e){if(!inp.parentNode.contains(e.target))drop.style.display='none';});
}

// ── INIT ──
window.addEventListener('DOMContentLoaded',function(){
  renderTeamCards();
  loadTeamStats();
  initSearch();
  // Auto-select MI on load
  setTimeout(function(){selectTeam('mi');},300);
});
</script>
</body>
