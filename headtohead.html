<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KricIQ — Head to Head</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080b11;--s1:#0f131c;--s2:#161c28;--s3:#1e2535;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --acc:#00f5aa;--acc2:#ff5f40;--acc3:#5b9fff;--acc4:#f7c948;
  --text:#eef0f4;--muted:#5a6275;--muted2:#8892a4;
  --font-d:'Bebas Neue',sans-serif;--font-b:'Outfit',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;overflow-x:hidden;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;background:rgba(8,11,17,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;backdrop-filter:blur(16px);}
.nav-links{display:flex;gap:2px;}
.nl{padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted2);cursor:pointer;transition:.15s;border:none;background:none;font-family:var(--font-b);text-decoration:none;}
.nl:hover{color:var(--text);background:var(--s2);}
.nl.on{color:var(--acc);background:rgba(0,245,170,.08);}
.nav-r{display:flex;align-items:center;gap:10px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:5px 12px;position:relative;}
.search-box input{background:none;border:none;color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;width:180px;}
.search-box input::placeholder{color:var(--muted);}

/* SELECTOR */
.selector{max-width:1160px;margin:0 auto;padding:32px 28px;}
.selector-title{font-family:var(--font-d);font-size:42px;letter-spacing:1px;margin-bottom:6px;}
.selector-title span{color:var(--acc);}
.selector-sub{font-size:13px;color:var(--muted2);margin-bottom:28px;}
.team-selector{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-bottom:28px;}
.ts-side{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px;}
.ts-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
.ts-select{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font-b);font-size:14px;outline:none;cursor:pointer;}
.ts-select:focus{border-color:var(--acc);}
.ts-vs{font-family:var(--font-d);font-size:36px;color:var(--muted);text-align:center;}
.compare-btn{display:block;width:100%;padding:14px;background:var(--acc);border:none;border-radius:10px;font-family:var(--font-d);font-size:18px;letter-spacing:1px;color:#000;cursor:pointer;transition:.15s;}
.compare-btn:hover{background:#00d494;}

/* RESULTS */
.results{max-width:1160px;margin:0 auto;padding:0 28px 40px;display:none;}
.results.show{display:block;}
.r-header{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-bottom:24px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:24px;}
.r-team{text-align:center;}
.r-badge{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:22px;margin:0 auto 8px;}
.r-name{font-family:var(--font-d);font-size:24px;letter-spacing:.5px;}
.r-vs{font-family:var(--font-d);font-size:48px;color:var(--muted);text-align:center;}

/* STATS COMPARISON */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.stat-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.sc-title{padding:14px 18px;border-bottom:1px solid var(--border);font-family:var(--font-d);font-size:16px;letter-spacing:.5px;}
.sc-title em{color:var(--acc);font-style:normal;}
.sc-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);}
.sc-row:last-child{border-bottom:none;}
.sc-val{font-family:var(--font-d);font-size:22px;}
.sc-val.t1{text-align:left;}
.sc-val.t2{text-align:right;}
.sc-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;}
.sc-val.winner{color:var(--acc);}
.sc-val.loser{color:var(--muted2);}

/* WIN BAR */
.win-bar-wrap{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px;}
.win-bar-title{font-family:var(--font-d);font-size:16px;letter-spacing:.5px;margin-bottom:16px;}
.win-bar-title em{color:var(--acc);font-style:normal;}
.win-bar-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;}
.win-bar{height:12px;border-radius:6px;background:var(--s3);overflow:hidden;display:flex;}
.win-bar-t1{height:100%;border-radius:6px 0 0 6px;transition:width .8s ease;}
.win-bar-t2{height:100%;border-radius:0 6px 6px 0;transition:width .8s ease;}
.win-bar-stats{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;}

.loading-msg{text-align:center;padding:40px;color:var(--muted2);}
.spinner{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px;}
@keyframes spin{to{transform:rotate(360deg)}}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(8,11,17,.97);border-top:1px solid rgba(255,255,255,0.1);padding:8px 0 12px;backdrop-filter:blur(20px);}
.mobile-nav-inner{display:flex;justify-content:space-around;align-items:center;}
.mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 16px;}
.mnav-item svg{width:20px;height:20px;stroke:var(--muted2);}
.mnav-item span{font-size:10px;color:var(--muted2);}
.mnav-item.active svg{stroke:var(--acc);}
.mnav-item.active span{color:var(--acc);}
@media(max-width:768px){
  .mobile-nav{display:block;}
  body{padding-bottom:70px;}
  .nav-links{display:none;}
  .team-selector{grid-template-columns:1fr;gap:12px;}
  .ts-vs{display:none;}
  .stats-grid{grid-template-columns:1fr;}
  .r-header{grid-template-columns:1fr auto 1fr;}
}
</style>

<div class="selector">

<script>
var _kapi = 'https://kriciq-api.onrender.com/api';

var TEAMS = [
  {id:'mi',   name:'Mumbai Indians',        abbr:'MI',   color:'#4d9fff', bg:'rgba(77,159,255,.15)',  apiName:'Mumbai Indians'},
  {id:'csk',  name:'Chennai Super Kings',   abbr:'CSK',  color:'#f7c948', bg:'rgba(247,201,72,.15)',  apiName:'Chennai Super Kings'},
  {id:'rcb',  name:'Royal Challengers',     abbr:'RCB',  color:'#ff5f40', bg:'rgba(255,95,64,.15)',   apiName:'Royal Challengers Bangalore'},
  {id:'kkr',  name:'Kolkata Knight Riders', abbr:'KKR',  color:'#c084fc', bg:'rgba(192,132,252,.15)', apiName:'Kolkata Knight Riders'},
  {id:'srh',  name:'Sunrisers Hyderabad',   abbr:'SRH',  color:'#ff8c40', bg:'rgba(255,140,64,.15)',  apiName:'Sunrisers Hyderabad'},
  {id:'dc',   name:'Delhi Capitals',        abbr:'DC',   color:'#3b82f6', bg:'rgba(59,130,246,.15)',  apiName:'Delhi Capitals'},
  {id:'pbks', name:'Punjab Kings',          abbr:'PBKS', color:'#ff5f40', bg:'rgba(255,95,64,.12)',   apiName:'Punjab Kings'},
  {id:'rr',   name:'Rajasthan Royals',      abbr:'RR',   color:'#e879f9', bg:'rgba(232,121,249,.15)', apiName:'Rajasthan Royals'},
  {id:'lsg',  name:'Lucknow Super Giants',  abbr:'LSG',  color:'#00f5aa', bg:'rgba(0,245,170,.12)',   apiName:'Lucknow Super Giants'},
  {id:'gt',   name:'Gujarat Titans',        abbr:'GT',   color:'#5b9fff', bg:'rgba(91,159,255,.15)',  apiName:'Gujarat Titans'},
];

function populateSelects(){
  var s1 = document.getElementById('team1-select');
  var s2 = document.getElementById('team2-select');
  TEAMS.forEach(function(t, i){
    var o1 = document.createElement('option');
    o1.value = t.id; o1.textContent = t.name;
    if(i===1) o1.selected=true; // CSK default for team1
    s1.appendChild(o1);
    var o2 = document.createElement('option');
    o2.value = t.id; o2.textContent = t.name;
    if(i===0) o2.selected=true; // MI default for team2
    s2.appendChild(o2);
  });
}

function compareTeams(){
  var t1id = document.getElementById('team1-select').value;
  var t2id = document.getElementById('team2-select').value;
  if(t1id === t2id){
    alert('Please select two different teams!');
    return;
  }
  var t1 = TEAMS.find(function(t){return t.id===t1id;});
  var t2 = TEAMS.find(function(t){return t.id===t2id;});

  var results = document.getElementById('results');
  results.classList.add('show');
  document.getElementById('results-content').innerHTML =
    '<div class="loading-msg"><div class="spinner"></div>Loading head to head data...</div>';
  results.scrollIntoView({behavior:'smooth'});

  var apiT1 = t1.apiName.replace(/ /g,'-');
  var apiT2 = t2.apiName.replace(/ /g,'-');

  fetch(_kapi+'/h2h/'+encodeURIComponent(apiT1)+'/'+encodeURIComponent(apiT2))
    .then(function(r){return r.json();})
    .then(function(data){
      renderResults(t1, t2, data);
    }).catch(function(){
      document.getElementById('results-content').innerHTML =
        '<div class="loading-msg">Could not load data. Please try again.</div>';
    });
}

function renderResults(t1, t2, data){
  var b1 = data.team1_batting || {};
  var b2 = data.team2_batting || {};

  var matches = Math.max(b1.matches||0, b2.matches||0);
  var t1runs = b1.runs || 0;
  var t2runs = b2.runs || 0;
  var t1avg = b1.avg_score || 0;
  var t2avg = b2.avg_score || 0;
  var t1wkts = b1.wickets_lost || 0;
  var t2wkts = b2.wickets_lost || 0;

  // Who scores more = better batting
  var t1winPct = t1runs > t2runs ? Math.round(t1runs/(t1runs+t2runs)*100) : Math.round(100-t2runs/(t1runs+t2runs)*100);
  var t2winPct = 100 - t1winPct;

  var html = '';

  // Header
  html += '<div class="r-header">'
    +'<div class="r-team">'
    +'<div class="r-badge" style="background:'+t1.bg+';color:'+t1.color+'">'+t1.abbr+'</div>'
    +'<div class="r-name" style="color:'+t1.color+'">'+t1.name+'</div>'
    +'</div>'
    +'<div class="r-vs">VS</div>'
    +'<div class="r-team">'
    +'<div class="r-badge" style="background:'+t2.bg+';color:'+t2.color+'">'+t2.abbr+'</div>'
    +'<div class="r-name" style="color:'+t2.color+'">'+t2.name+'</div>'
    +'</div>'
    +'</div>';

  // Win bar
  html += '<div class="win-bar-wrap">'
    +'<div class="win-bar-title">Scoring <em>Dominance</em></div>'
    +'<div class="win-bar-labels"><span style="color:'+t1.color+'">'+t1.abbr+' '+t1winPct+'%</span><span style="color:'+t2.color+'">'+t2winPct+'% '+t2.abbr+'</span></div>'
    +'<div class="win-bar">'
    +'<div class="win-bar-t1" style="width:'+t1winPct+'%;background:'+t1.color+'"></div>'
    +'<div class="win-bar-t2" style="width:'+t2winPct+'%;background:'+t2.color+'"></div>'
    +'</div>'
    +'<div class="win-bar-stats">'
    +'<span style="color:'+t1.color+'">'+(t1runs.toLocaleString())+' runs scored vs '+t2.abbr+'</span>'
    +'<span style="color:var(--muted)">'+matches+' matches</span>'
    +'<span style="color:'+t2.color+'">'+(t2runs.toLocaleString())+' runs scored vs '+t1.abbr+'</span>'
    +'</div>'
    +'</div>';

  // Stats comparison
  function statRow(label, v1, v2, higherIsBetter){
    var c1='', c2='';
    if(higherIsBetter !== null){
      if(higherIsBetter){
        c1 = v1>v2?'winner':'loser';
        c2 = v2>v1?'winner':'loser';
      } else {
        c1 = v1<v2?'winner':'loser';
        c2 = v2<v1?'winner':'loser';
      }
    }
    return '<div class="sc-row">'
      +'<div class="sc-val t1" style="color:'+(c1==='winner'?t1.color:c1==='loser'?'var(--muted2)':'var(--text)')+'">'+v1+'</div>'
      +'<div class="sc-label">'+label+'</div>'
      +'<div class="sc-val t2" style="color:'+(c2==='winner'?t2.color:c2==='loser'?'var(--muted2)':'var(--text)')+'">'+v2+'</div>'
      +'</div>';
  }

  var t1wins = data.team1_wins || 0;
  var t2wins = data.team2_wins || 0;
  var totalM = data.total_matches || matches;
  var t1winPct2 = totalM > 0 ? Math.round(t1wins/totalM*100) : 0;
  var t2winPct2 = 100 - t1winPct2;
  var t1highest = data.team1_highest || '—';
  var t2highest = data.team2_highest || '—';
  var winner = t1wins > t2wins ? t1 : t2wins > t1wins ? t2 : null;

  html += '<div class="stats-grid">'
    // Win/Loss card
    +'<div class="stat-card">'
    +'<div class="sc-title">Win / <em>Loss Record</em></div>'
    +'<div style="padding:16px 18px;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +'<div style="text-align:center;"><div style="font-family:var(--font-d);font-size:48px;color:'+t1.color+'">'+t1wins+'</div><div style="font-size:11px;color:var(--muted);">'+t1.abbr+' WINS</div></div>'
    +'<div style="text-align:center;font-family:var(--font-d);font-size:24px;color:var(--muted)">VS</div>'
    +'<div style="text-align:center;"><div style="font-family:var(--font-d);font-size:48px;color:'+t2.color+'">'+t2wins+'</div><div style="font-size:11px;color:var(--muted);">'+t2.abbr+' WINS</div></div>'
    +'</div>'
    +'<div style="height:8px;border-radius:4px;background:var(--s3);overflow:hidden;display:flex;margin-bottom:8px;">'
    +'<div style="width:'+t1winPct2+'%;background:'+t1.color+';border-radius:4px 0 0 4px;transition:width .8s;"></div>'
    +'<div style="width:'+t2winPct2+'%;background:'+t2.color+';border-radius:0 4px 4px 0;"></div>'
    +'</div>'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);">'
    +'<span style="color:'+t1.color+'">'+t1winPct2+'%</span>'
    +'<span>'+totalM+' matches played</span>'
    +'<span style="color:'+t2.color+'">'+t2winPct2+'%</span>'
    +'</div>'
    +'</div>'
    +'</div>'
    // Batting stats card
    +'<div class="stat-card">'
    +'<div class="sc-title">Batting <em>Stats</em></div>'
    +statRow('Total Runs', t1runs.toLocaleString(), t2runs.toLocaleString(), true)
    +statRow('Avg Score per Innings', t1avg, t2avg, true)
    +statRow('Highest Score', t1highest, t2highest, true)
    +statRow('Wickets Lost', t1wkts, t2wkts, false)
    +'</div>'
    +'</div>';

  document.getElementById('results-content').innerHTML = html;

  // Now fetch top performers
  var apiT1 = t1.apiName.replace(/ /g,'-');
  var apiT2 = t2.apiName.replace(/ /g,'-');
  fetch(_kapi+'/h2h-performers/'+encodeURIComponent(apiT1)+'/'+encodeURIComponent(apiT2))
    .then(function(r){return r.json();})
    .then(function(perf){
      var perfHtml = '<div class="stats-grid" style="margin-top:16px;">'
        // Team 1 performers
        +'<div class="stat-card">'
        +'<div class="sc-title" style="color:'+t1.color+'">'+t1.abbr+' <em>Top Performers</em></div>'
        +'<div style="padding:14px 18px;">'
        +'<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;">Top Batters vs '+t2.abbr+'</div>'
        +perf.t1_batters.map(function(p,i){
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);">'
            +'<div style="display:flex;align-items:center;gap:8px;">'
            +'<span style="font-family:var(--font-d);font-size:13px;color:var(--muted);width:16px;">'+(i+1)+'</span>'

            +'</div>'
            +'<span style="font-family:var(--font-d);font-size:16px;color:'+t2.color+'">'+p.runs+'</span>'

        +'<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 10px;">Top Wicket Takers vs '+t1.abbr+'</div>'
        +perf.t2_bowlers.map(function(p,i){
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);">'
            +'<div style="display:flex;align-items:center;gap:8px;">'

            +'<span style="font-family:var(--font-d);font-size:16px;color:var(--acc2)">'+p.wickets+' wkts</span>'
            +'</div>';
        }).join('')
        +'</div></div>'
        +'</div>';

      document.getElementById('results-content').innerHTML += perfHtml;
    }).catch(function(){});
}

// Nav search
function initSearch(){
  var inp=document.getElementById('nav-search');
  if(!inp) return;
  var drop=document.createElement('div');
  drop.style.cssText='display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:280px;background:#0f131c;border:1px solid rgba(255,255,255,0.1);border-radius:8px;z-index:999;max-height:280px;overflow-y:auto;';
  inp.parentNode.appendChild(drop);
  var t;
  inp.addEventListener('input',function(){
    clearTimeout(t);var q=this.value.trim();
    if(q.length<2){drop.style.display='none';return;}
    t=setTimeout(function(){
      fetch(_kapi+'/search/'+encodeURIComponent(q))
        .then(function(r){return r.json();})
        .then(function(players){
          drop.innerHTML=players.length
            ?players.map(function(p){var id=p.player.replace(/ /g,'-');return '<a href="player.html?id='+id+'" style="display:flex;justify-content:space-between;padding:9px 14px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.05);color:#eef0f4;font-size:13px;">'+p.player+'<span style="color:#5a6275;font-size:11px;">'+Math.round(p.runs)+' runs</span></a>';}).join('')
            :'<div style="padding:10px 14px;color:#5a6275;font-size:13px;">No players found</div>';
          drop.style.display='block';
        }).catch(function(){drop.style.display='none';});
    },300);
  });
  document.addEventListener('click',function(e){if(!inp.parentNode.contains(e.target))drop.style.display='none';});
}

window.addEventListener('DOMContentLoaded',function(){
  populateSelects();
  initSearch();
});
</script>
