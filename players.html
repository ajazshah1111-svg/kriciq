<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KricIQ — All IPL Players</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#080b11; --s1:#0f131c; --s2:#161c28; --s3:#1e2535;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.1);
  --acc:#00f5aa; --acc2:#ff5f40; --acc3:#5b9fff; --acc4:#f7c948;
  --text:#eef0f4; --muted:#5a6275; --muted2:#8892a4;
  --font-d:'Bebas Neue',sans-serif; --font-b:'Outfit',sans-serif;
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;overflow-x:hidden;}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;background:rgba(8,11,17,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;backdrop-filter:blur(16px);}
.logo{font-family:var(--font-d);font-size:24px;letter-spacing:2px;color:var(--acc);text-decoration:none;}
.logo em{color:var(--text);font-style:normal;}
.nav-links{display:flex;gap:2px;}
.nl{padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted2);cursor:pointer;transition:.15s;border:none;background:none;font-family:var(--font-b);text-decoration:none;}
.nl:hover{color:var(--text);background:var(--s2);}
.nl.on{color:var(--acc);background:rgba(0,245,170,.08);}
.nav-r{display:flex;align-items:center;gap:10px;}
.pro-badge{background:linear-gradient(135deg,#f7c948,#ff8c40);color:#000;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.search-wrap-nav{position:relative;}
.nav-search-input{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:5px 12px;}
.nav-search-input input{background:none;border:none;color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;width:160px;}
.nav-search-input input::placeholder{color:var(--muted);}
#nav-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#0f131c;border:1px solid rgba(255,255,255,0.1);border-radius:8px;margin-top:4px;z-index:999;max-height:260px;overflow-y:auto;}

/* PAGE HEADER */
.page-header{background:var(--s1);border-bottom:1px solid var(--border);padding:28px 28px 0;}
.page-header-inner{max-width:1160px;margin:0 auto;}
.page-title{font-family:var(--font-d);font-size:42px;letter-spacing:1px;margin-bottom:4px;}
.page-title span{color:var(--acc);}
.page-sub{font-size:13px;color:var(--muted2);margin-bottom:20px;}

/* FILTER BAR */
.filter-bar{display:flex;gap:10px;align-items:center;padding:14px 0;flex-wrap:wrap;}
.filter-search{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:7px 14px;flex:1;max-width:300px;}
.filter-search input{background:none;border:none;color:var(--text);font-family:var(--font-b);font-size:13px;outline:none;width:100%;}
.filter-search input::placeholder{color:var(--muted);}
.sort-btn{padding:7px 14px;background:var(--s2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted2);cursor:pointer;font-family:var(--font-b);transition:.15s;}
.sort-btn:hover,.sort-btn.on{background:rgba(0,245,170,.08);border-color:rgba(0,245,170,.2);color:var(--acc);}
.player-count{font-size:12px;color:var(--muted);margin-left:auto;}

/* MAIN WRAP */
.wrap{max-width:1160px;margin:0 auto;padding:20px 28px;}

/* PLAYER GRID */
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.pcard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s;text-decoration:none;display:block;}
.pcard:hover{border-color:var(--border2);background:var(--s2);transform:translateY(-2px);}
.pcard-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pcard-avatar{width:40px;height:40px;border-radius:8px;background:linear-gradient(145deg,#0d2218,#091826);border:1px solid rgba(0,245,170,.2);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:14px;color:rgba(0,245,170,.6);flex-shrink:0;}
.pcard-name{font-size:13px;font-weight:500;line-height:1.3;}
.pcard-rank{font-size:10px;color:var(--muted);margin-top:1px;}
.pcard-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pcs{background:var(--s2);border-radius:6px;padding:7px 8px;text-align:center;}
.pcs-v{font-family:var(--font-d);font-size:16px;line-height:1;}
.pcs-k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--muted2);}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* MOBILE NAV */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(8,11,17,.97);border-top:1px solid rgba(255,255,255,0.1);padding:8px 0 12px;backdrop-filter:blur(20px);}
.mobile-nav-inner{display:flex;justify-content:space-around;align-items:center;}
.mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 16px;border-radius:8px;}
.mnav-item svg{width:20px;height:20px;stroke:var(--muted2);}
.mnav-item span{font-size:10px;color:var(--muted2);}
.mnav-item.active svg{stroke:var(--acc);}
.mnav-item.active span{color:var(--acc);}
@media(max-width:768px){
  .mobile-nav{display:block;}
  body{padding-bottom:70px;}
  .player-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
  .nav-links,.nav-r .pro-badge{display:none;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" title="KricIQ Home" style="display:block;background:#080b11;border-radius:6px;padding:2px 8px;"><img src="logo.png" alt="KricIQ" height="48" style="display:block;"></a>
  <div class="nav-links">
    <a href="players.html" class="nl on">Players</a>
    <a href="teams.html" class="nl">Teams</a>
    <a href="teams.html" class="nl">Head-to-Head</a>
    <a href="#" class="nl">Match Predictor</a>
    <a href="#" class="nl">Live</a>
  </div>
  <div class="nav-r">
    <div class="search-wrap-nav">
      <div class="nav-search-input">
        <svg width="13" height="13" fill="none" stroke="#5a6275" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="nav-search" placeholder="Search player…" autocomplete="off"/>
      </div>
      <div id="nav-dropdown"></div>
    </div>
    <div class="pro-badge">PRO</div>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <div class="page-title">IPL <span>Players</span></div>
    <div class="page-sub">All 406 IPL players · sorted by runs · click any player to see full profile</div>
    <div class="filter-bar">
      <div class="filter-search">
        <svg width="13" height="13" fill="none" stroke="#5a6275" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="filter-input" placeholder="Filter players…"/>
      </div>
      <button class="sort-btn on" data-sort="runs">Runs</button>
      <button class="sort-btn" data-sort="average">Average</button>
      <button class="sort-btn" data-sort="strike_rate">Strike Rate</button>
      <button class="sort-btn" data-sort="matches">Matches</button>
      <div class="player-count" id="player-count"></div>
    </div>
  </div>
</div>

<!-- PLAYERS GRID -->
<div class="wrap">
  <div id="players-container">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading all IPL players…
    </div>
  </div>
</div>

<div class="mobile-nav"><div class="mobile-nav-inner">
  <a href="index.html" class="mnav-item"><svg fill="none" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955a1.5 1.5 0 0 1 2.092 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg><span>Home</span></a>
  <a href="players.html" class="mnav-item active"><svg fill="none" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg><span>Players</span></a>
  <a href="teams.html" class="mnav-item"><svg fill="none" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z"/></svg><span>Teams</span></a>
  <a href="#" class="mnav-item"><svg fill="none" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg><span>Predictor</span></a>
  <a href="#" class="mnav-item"><svg fill="none" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h12a2.25 2.25 0 0 0 2.25-2.25V3m-4.5 0v11.25m-5.25 0V3M12 3v11.25M3.75 8.25h16.5"/></svg><span>Live</span></a>
</div></div>

<script>
const API = 'https://kriciq-api.onrender.com/api';
let allPlayers = [];
let currentSort = 'runs';

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function getColor(index) {
  const colors = ['rgba(0,245,170,.6)','rgba(91,159,255,.6)','rgba(247,201,72,.6)','rgba(255,95,64,.6)','rgba(0,245,170,.4)'];
  return colors[index % colors.length];
}

function renderPlayers(players) {
  const container = document.getElementById('players-container');
  document.getElementById('player-count').textContent = players.length + ' players';

  if (!players.length) {
    container.innerHTML = '<div class="loading" style="color:var(--muted2)">No players found</div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'player-grid';

  players.forEach((p, i) => {
    const id = p.player.replace(/ /g, '-');
    const initials = getInitials(p.player);
    const color = getColor(i);

    let statLabel, statValue;
    if (currentSort === 'average') {
      statLabel = 'AVG'; statValue = parseFloat(p.average).toFixed(1);
    } else if (currentSort === 'strike_rate') {
      statLabel = 'SR'; statValue = parseFloat(p.strike_rate).toFixed(1);
    } else if (currentSort === 'matches') {
      statLabel = 'MATCHES'; statValue = Math.round(p.matches);
    } else {
      statLabel = 'RUNS'; statValue = Math.round(p.runs).toLocaleString();
    }

    const card = document.createElement('a');
    card.href = 'player.html?id=' + encodeURIComponent(id);
    card.className = 'pcard';
    card.innerHTML = `
      <div class="pcard-top">
        <div class="pcard-avatar" style="color:${color}">${initials}</div>
        <div>
          <div class="pcard-name">${p.player}</div>
          <div class="pcard-rank">#${i+1} by ${currentSort.replace('_',' ')}</div>
        </div>
      </div>
      <div class="pcard-stats">
        <div class="pcs"><div class="pcs-v" style="color:var(--acc)">${statValue}</div><div class="pcs-k">${statLabel}</div></div>
        <div class="pcs"><div class="pcs-v" style="color:var(--muted2)">${Math.round(p.matches)}</div><div class="pcs-k">MATCHES</div></div>
      </div>`;
    grid.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(grid);
}

function sortAndFilter() {
  const q = document.getElementById('filter-input').value.toLowerCase();
  let filtered = allPlayers.filter(p => p.player.toLowerCase().includes(q));
  filtered.sort((a, b) => (b[currentSort] || 0) - (a[currentSort] || 0));
  renderPlayers(filtered);
}

async function loadPlayers() {
  try {
    const res = await fetch(API + '/players');
    allPlayers = await res.json();
    sortAndFilter();
  } catch(e) {
    document.getElementById('players-container').innerHTML =
      '<div class="loading">Failed to load players. Please refresh.</div>';
  }
}

// Sort buttons
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('on'));
    this.classList.add('on');
    currentSort = this.dataset.sort;
    sortAndFilter();
  });
});

// Filter input
document.getElementById('filter-input').addEventListener('input', sortAndFilter);

// Nav search
const navSearch = document.getElementById('nav-search');
const navDropdown = document.getElementById('nav-dropdown');
let searchTimer;

navSearch.addEventListener('input', function() {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (q.length < 2) { navDropdown.style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    try {
      const res = await fetch(API + '/search/' + encodeURIComponent(q));
      const players = await res.json();
      if (!players.length) {
        navDropdown.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:#5a6275;">No players found</div>';
      } else {
        navDropdown.innerHTML = players.map(p => {
          const id = p.player.replace(/ /g, '-');
          return '<a href="player.html?id=' + encodeURIComponent(id) + '" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.05);" onmouseover="this.style.background=\'rgba(0,245,170,0.05)\'" onmouseout="this.style.background=\'none\'">'
            + '<span style="font-size:13px;color:#eef0f4;">' + p.player + '</span>'
            + '<span style="font-size:11px;color:#5a6275;">' + Math.round(p.runs) + ' runs</span>'
            + '</a>';
        }).join('');
      }
      navDropdown.style.display = 'block';
    } catch(e) { navDropdown.style.display = 'none'; }
  }, 300);
});

document.addEventListener('click', function(e) {
  if (!navSearch.contains(e.target) && !navDropdown.contains(e.target)) {
    navDropdown.style.display = 'none';
  }
});

loadPlayers();
</script>
</body>
</html>
